generated: '2026-07-19'
method: searched
source: https://lightning.ai/docs/platform/developers
docs:
- https://lightning.ai/docs/platform/developers/sdk
- https://lightning.ai/docs/platform/developers/cli
- https://lightning.ai/docs/platform/inference/model-apis
notes: >-
  Cross-cutting request/response semantics for the two Lightning AI HTTP surfaces. Captured from
  the public docs, the provider's published Agent Skills, and live probes. Fields the provider
  does not document are recorded as unknown rather than guessed.
authentication:
  style: dual — HTTP Basic (platform) and Bearer (Model APIs)
  detail: authentication/lightningai-authentication.yml
surfaces:
- name: Lightning Model APIs (LLM gateway)
  base_url: https://lightning.ai/v1
  style: OpenAI-compatible REST
  compatibility: >-
    Callable with the OpenAI Python SDK, with litai, or with any OpenAI-compatible client. The
    docs also publish an Anthropic-compatible configuration for Claude Code
    (ANTHROPIC_BASE_URL=https://lightning.ai/).
  model_naming: provider/model — e.g. openai/gpt-5, anthropic/claude-opus-4-8, google/gemini-2.5-pro
  public_catalog: GET https://lightning.ai/api/v1/models (unauthenticated; {"object":"list","data":[...]})
- name: Lightning Platform API
  base_url: https://lightning.ai/api/v1
  style: gRPC-gateway generated REST
  evidence: >-
    Error payloads carry the gRPC-gateway envelope, and the first-party Go client in
    Lightning-AI/sdk is generated from an internal OpenAPI/Swagger definition
    (go/internal/lightningcloud/openapi/generated).
  escape_hatch: 'lightning api <endpoint> — raw REST call through the CLI'
  example_endpoints:
  - GET /v1/memberships
  - POST /v1/agents/{assistant_id}/conversations
idempotency:
  supported: false
  detail: >-
    Lightning AI does not document an idempotency key header or a request-replay contract on
    either surface. Resource creation via the SDK/CLI is name-scoped (a Studio, Job, Deployment,
    Sandbox or Model is addressed as org/teamspace/name), which makes create calls
    name-collision-detecting rather than idempotency-key-based.
pagination:
  documented: false
  detail: >-
    No pagination contract is published in the platform docs. The generated Go client exposes
    per-service list operations whose page parameters are not part of any public specification.
versioning:
  scheme: uri-path
  current: v1
  detail: Both surfaces are pinned at /v1; no version header, date-pinning or version train is documented.
error_envelope:
  format: grpc-gateway status
  shape: '{"code": <int>, "message": "<string>", "details": []}'
  verified_example: >-
    GET https://lightning.ai/v1/models with no credentials returns HTTP 401 with
    {"code":16,"message":"unauthenticated","details":[]} — code 16 is the gRPC UNAUTHENTICATED code.
  problem_json: false
  detail: errors/ — no RFC 9457 application/problem+json is used
rate_limit_signaling:
  documented_headers: false
  detail: >-
    Model API limits are published as a per-plan table (requests/minute and tokens/minute) rather
    than as response headers; no RateLimit-* or X-RateLimit-* header contract is documented.
  artifact: rate-limits/lightningai-rate-limits.yml
tracing:
  request_id_header: unknown
  detail: no request-id or correlation-id header is documented
metadata:
  detail: >-
    Resources are addressed and organized by org/teamspace naming and by teamspace-scoped tags;
    no free-form metadata key/value contract is documented on the public API.
billing_context:
  detail: >-
    Model-API inference is billed to a resolved teamspace. Resolution order is the explicit
    teamspace argument, then LIGHTNING_TEAMSPACE, then the user's default teamspace.
related:
- authentication/lightningai-authentication.yml
- rate-limits/lightningai-rate-limits.yml
- lifecycle/lightningai-lifecycle.yml
- cli/lightningai-cli.yml
