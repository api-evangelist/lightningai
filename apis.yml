aid: lightningai
name: Lightning.AI
description: >-
  Lightning AI is an AI development cloud from the creators of PyTorch Lightning. The platform
  bundles browser-based GPU Studios, batch and multi-node training jobs, autoscaled model and
  container deployments, ephemeral code-execution Sandboxes, teamspace data and model registries,
  and an OpenAI-compatible LLM gateway (Model APIs) that fronts hosted models from OpenAI,
  Anthropic, Google and open-weights providers behind one key and one bill. Developers reach the
  platform through the lightning-sdk Python package and its lightning CLI, an @lightningai/sdk
  TypeScript SDK for Sandboxes, and a v1 REST surface reachable with the `lightning api` escape
  hatch. Lightning AI also publishes an llms.txt, a docs manifest registry, and six first-party
  Agent Skills in SKILL.md format for coding agents.
