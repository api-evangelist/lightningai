- aid: lightningai:platform-api
  name: Lightning AI Platform API
  description: >-
    The v1 REST surface behind the Lightning AI platform — Studios, Jobs, multi-machine training,
    Deployments, Sandboxes, teamspaces, memberships, datasets and the model checkpoint registry.
    Authenticated with HTTP Basic using LIGHTNING_USER_ID and LIGHTNING_API_KEY, and reachable
    from the CLI with `lightning api <endpoint>` for anything the SDK does not wrap.
  humanURL: https://lightning.ai/docs/platform/developers/sdk
