apis:
- aid: lightningai:model-apis
  name: Lightning AI Model APIs
  description: >-
    OpenAI-compatible LLM gateway. Call hosted models from OpenAI, Anthropic, Google and
    open-weights providers through a single Bearer-authenticated endpoint with one bill, using
    provider/model names such as openai/gpt-5 or anthropic/claude-opus-4-8. Every user receives
    30 million free tokens per month. The public model catalog is served unauthenticated at
    https://lightning.ai/api/v1/models.
  humanURL: https://lightning.ai/docs/platform/inference/model-apis
  baseURL: https://lightning.ai/v1
